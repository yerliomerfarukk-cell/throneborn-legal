<!DOCTYPE html><meta charset="utf-8"><title>bridge</title>
<script>
window.addEventListener('message', async function (e) {
  if (!e.data || !e.data.get) return;
  var out = [];
  for (var i = 0; i < e.data.get.length; i++) {
    var p = e.data.get[i];
    var b = await (await fetch(p)).arrayBuffer();
    out.push([p, b]);
  }
  e.source.postMessage({ id: e.data.id, files: out }, e.origin, out.map(function (x) { return x[1]; }));
});
parent.postMessage({ bridgeReady: true }, '*');
</script>
